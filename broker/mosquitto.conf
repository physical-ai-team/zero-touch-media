# Zero-Touch Media Control 용 Mosquitto 설정 (LAN 전용, 인증 없음)
# 실행:  "C:\Program Files\mosquitto\mosquitto.exe" -c broker\mosquitto.conf -v
# Mosquitto 2.x는 listener를 적지 않으면 localhost만 받는다 → ESP32가 접속하려면 아래 두 줄이 필요.
listener 1883 0.0.0.0
allow_anonymous true

# 보존(retain) 메시지는 메모리에만 둔다. 브로커를 껐다 켜면 status/hello가 사라지고, 장치가 재접속하면 다시 채운다.
persistence false
